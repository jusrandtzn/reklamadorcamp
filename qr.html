<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beach Camp RSVP QR</title><body style="font:16px system-ui;max-width:600px;margin:4rem auto;padding:1rem"><h1>RSVP link QR code</h1><p>Enter the published public website URL to make a scannable QR code.</p><label>Public RSVP URL <input id="url" placeholder="https://username.github.io/repository/" style="width:min(100%,420px);padding:.6rem"></label><p><img id="qr" alt="QR code for RSVP website" width="280" height="280"></p><button onclick="draw()">Make QR code</button><script>function draw(){let u=document.querySelector('#url').value.trim();if(!u)return;document.querySelector('#qr').src='https://api.qrserver.com/v1/create-qr-code/?size=280x280&data='+encodeURIComponent(u)}document.querySelector('#url').addEventListener('change',draw)</script></body></html>
