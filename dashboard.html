<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Beach Camp — Host dashboard</title><link rel="stylesheet" href="styles.css"><style>main{max-width:900px;margin:45px auto;padding:0 22px}.screen{display:block;margin:0;max-width:none;padding:0}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 25px}.head h1{font-size:48px}.panel{background:#211b2add;border:1px solid #ffffff43;padding:20px;margin-bottom:18px}.field input{max-width:420px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row .field{flex:1;min-width:200px;margin:0}.summary{font-size:12px;letter-spacing:1px;color:#ffe3bd}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #ffffff26;vertical-align:top}th{font-size:10px;letter-spacing:1px;color:#ffd27f}.truth{max-width:250px;line-height:1.5}.muted{color:#ddcbbb;font-size:12px}@media(max-width:600px){main{margin:30px auto}.head h1{font-size:40px}}</style></head><body><div class="scene"><div class="sun"></div><div class="ocean"></div><div class="shore"></div><div class="palms" aria-hidden="true">♣</div><div class="crowd"><i></i><i></i><i></i><i></i><i></i></div></div><div class="shade"></div><header><a class="brand" href="index.html"><span class="brand-mark">BC</span><span>BEACH CAMP<small>HOST DASHBOARD</small></span></a><a class="music" href="index.html">↗ RSVP SITE</a></header><main><div class="head"><div><div class="eyebrow">PRIVATE HOST VIEW</div><h1>THE <em>GUEST LIST</em></h1></div><button id="signout" class="button ghost" hidden>SIGN OUT</button></div><section id="login" class="panel"><p class="intro">Sign in with your Firebase host account to see live submissions.</p><form id="login-form" class="row"><label class="field"><span>HOST EMAIL</span><input name="email" type="email"
